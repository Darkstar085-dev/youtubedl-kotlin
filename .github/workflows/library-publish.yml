name: Build, test, and publish library modules

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and release build
        run: |
          ./gradlew --no-daemon \
            :library:testDebugUnitTest \
            :library:assembleRelease \
            :ffmpeg:assembleRelease \
            :aria2c:assembleRelease

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure GitHub Packages Maven publishing
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Publishing to GitHub Packages must be configured in each module's MavenPublication repository block before tagging."
          echo "Current module publication scripts define publications but do not define a Maven repository."
          echo "This job intentionally fails until a repository is configured; runtime ZIP releases remain available independently."
          exit 1
